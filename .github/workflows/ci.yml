name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Client: lint + build ───────────────────────────────────────────────────
  client:
    name: Client (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build (production)
        run: npm run build
        env:
          VITE_API_BASE_URL: https://placeholder.execute-api.ap-south-1.amazonaws.com/prod
          VITE_ADMIN_API_KEY: ""
          VITE_PHOTOS_CDN: ""

      - name: Verify build artifacts
        run: |
          test -f dist/index.html    || (echo "Missing dist/index.html"   && exit 1)
          test -f dist/sw.js         || (echo "Missing dist/sw.js"        && exit 1)
          test -f dist/manifest.json || (echo "Missing dist/manifest.json" && exit 1)
          echo "✓ Build artifacts present"

  # ── Backend: test + SAM validate ──────────────────────────────────────────
  backend:
    name: Backend (test, sam validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      USE_DYNAMO: "false"    # use SQLite in CI — no AWS credentials needed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -v

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM build (validates template + packages Lambdas)
        run: sam build
        env:
          # Fake credentials so SAM build doesn't fail on credential lookup
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
          AWS_DEFAULT_REGION: ap-south-1

  # ── Deploy backend (main branch, manual trigger) ───────────────────────────
  # Uncomment once you have added the secrets below to your GitHub repo:
  #   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, DATABASE_URL
