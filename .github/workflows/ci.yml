name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Client: lint + build ───────────────────────────────────────────────────
  client:
    name: Client (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build (production)
        run: npm run build
        env:
          # Use placeholder values so the build doesn't fail on missing vars.
          # Real values are injected by Amplify at deploy time.
          VITE_API_BASE_URL: https://example.execute-api.us-east-1.amazonaws.com/prod
          VITE_ADMIN_API_KEY: ""
          VITE_PHOTOS_CDN: ""

      - name: Verify build output
        run: |
          test -f dist/index.html   || (echo "Missing dist/index.html"  && exit 1)
          test -f dist/sw.js        || (echo "Missing dist/sw.js"        && exit 1)
          test -f dist/manifest.json || (echo "Missing dist/manifest.json" && exit 1)
          echo "Build output OK"

  # ── Backend: test + SAM build ──────────────────────────────────────────────
  backend:
    name: Backend (test, sam build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -v

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM build (validates template + packages Lambdas)
        run: sam build --use-container
        # Note: --use-container builds inside a Lambda-compatible Docker image,
        # matching the production environment.  Requires Docker on the runner.
        # If Docker is unavailable in your runner, replace with: sam build

