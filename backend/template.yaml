AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  GroundTruth — offline-first local issue reporter.
  Flask app packaged as a container image, deployed to Lambda behind
  API Gateway via the AWS Lambda Web Adapter. Same app.py runs locally
  with `flask --app app run` and on Lambda, unchanged.

Parameters:
  DatabaseUrl:
    Type: String
    Description: Connection string for the RDS PostgreSQL + PostGIS instance
    NoEcho: true
    Default: ""

Resources:
  GroundTruthApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Cors:
        AllowMethods: "'GET,POST,PATCH,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub groundtruth-photos-${AWS::AccountId}

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      MemorySize: 512
      Timeout: 15
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          PHOTOS_BUCKET: !Ref PhotosBucket
          PORT: "8000"
      Events:
        RootApi:
          Type: Api
          Properties:
            RestApiId: !Ref GroundTruthApi
            Path: /
            Method: ANY
        ProxyApi:
          Type: Api
          Properties:
            RestApiId: !Ref GroundTruthApi
            Path: /{proxy+}
            Method: ANY
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: latest

Outputs:
  ApiUrl:
    Description: Invoke URL for the dev stage
    Value: !Sub "https://${GroundTruthApi}.execute-api.${AWS::Region}.amazonaws.com/dev/"
  PhotosBucketName:
    Value: !Ref PhotosBucket
