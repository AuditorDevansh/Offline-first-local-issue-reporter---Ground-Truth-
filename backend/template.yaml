AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  GroundTruth — fully serverless offline-first civic issue reporter.
  DynamoDB + Lambda + API Gateway + S3. No VPC, no RDS.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256
    Architectures: [x86_64]
    Environment:
      Variables:
        ISSUES_TABLE:   !Ref IssuesTable
        PHOTOS_BUCKET:  !Ref PhotosBucket
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        APP_VERSION:    !Ref AppVersion
        USE_DYNAMO:     "true"

Parameters:
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: >
      CORS origin for the client app.
      Set to your Amplify URL after first deploy,
      e.g. https://main.d1abc123.amplifyapp.com

  AppVersion:
    Type: String
    Default: "1.0.0"

  # Amplify parameters (filled in by deploy script)
  GithubRepo:
    Type: String
    Default: "https://github.com/AuditorDevansh/Offline-first-local-issue-reporter---Ground-Truth-"
    Description: GitHub repository URL for Amplify hosting

  GithubBranch:
    Type: String
    Default: "main"

Resources:

  # ── DynamoDB ─────────────────────────────────────────────────────────────────

  IssuesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: groundtruth-issues
      BillingMode: PAY_PER_REQUEST        # fully serverless, no provisioning
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true  # 35-day PITR backup
      SSESpecification:
        SSEEnabled: true                  # encryption at rest
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: created_at
          AttributeType: N
        - AttributeName: category
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        # Admin panel: filter by status, sorted newest first
        - IndexName: StatusCreatedAtIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # Admin panel: filter by category, sorted newest first
        - IndexName: CategoryCreatedAtIndex
          KeySchema:
            - AttributeName: category
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ── S3 photo storage ─────────────────────────────────────────────────────────

  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "groundtruth-photos-${AWS::AccountId}-${AWS::Region}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [PUT, GET]
            AllowedOrigins: ["*"]
            MaxAge: 3000
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  # ── IAM role for Lambda functions ────────────────────────────────────────────

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: groundtruth-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: GroundTruthDynamoS3
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt IssuesTable.Arn
                  - !Sub "${IssuesTable.Arn}/index/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::groundtruth-photos-${AWS::AccountId}-${AWS::Region}/photos/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::groundtruth-photos-${AWS::AccountId}-${AWS::Region}"

  # ── API Gateway ───────────────────────────────────────────────────────────────

  GroundTruthApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      TracingEnabled: true
      Cors:
        AllowMethods: "'GET,POST,PATCH,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Api-Key,Authorization'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 200
          ThrottlingBurstLimit: 400
          MetricsEnabled: true
      Auth:
        ApiKeyRequired: false
        UsagePlan:
          CreateUsagePlan: PER_API
          Description: GroundTruth admin usage plan
          Quota:
            Limit: 50000
            Period: DAY
          Throttle:
            RateLimit: 100
            BurstLimit: 200

  # ── Lambda Functions ──────────────────────────────────────────────────────────

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: groundtruth-health
      Handler: src/handlers/health.handler
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Description: Liveness probe
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref GroundTruthApi
            Path: /healthz
            Method: get

  SyncBatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: groundtruth-sync-batch
      Handler: src/handlers/sync_batch.handler
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Description: Receives the offline outbox from the client PWA
      Events:
        SyncBatch:
          Type: Api
          Properties:
            RestApiId: !Ref GroundTruthApi
            Path: /sync/batch
            Method: post

  NearbyIssuesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: groundtruth-nearby
      Handler: src/handlers/nearby_issues.handler
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Description: Geo-radius query for the map view
      Events:
        NearbyIssues:
          Type: Api
          Properties:
            RestApiId: !Ref GroundTruthApi
            Path: /issues/nearby
            Method: get

  IssueDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: groundtruth-issue-detail
      Handler: src/handlers/issue_detail.handler
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Description: Single issue GET / PATCH
      Events:
        GetIssue:
          Type: Api
          Properties:
            RestApiId: !Ref GroundTruthApi
            Path: /issues/{id}
            Method: get
        UpdateIssue:
          Type: Api
          Properties:
            RestApiId: !Ref GroundTruthApi
            Path: /issues/{id}
            Method: patch
            Auth:
              ApiKeyRequired: true

  PhotoUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: groundtruth-photo-upload
      Handler: src/handlers/photo_upload.handler
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Description: Generate presigned S3 URL for photo uploads
      Events:
        PhotoUpload:
          Type: Api
          Properties:
            RestApiId: !Ref GroundTruthApi
            Path: /issues/{id}/photo
            Method: post

  AdminIssuesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: groundtruth-admin
      Handler: src/handlers/admin_issues.handler
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Description: Admin panel — list issues, stats, bulk update
      Events:
        AdminListIssues:
          Type: Api
          Properties:
            RestApiId: !Ref GroundTruthApi
            Path: /admin/issues
            Method: get
            Auth:
              ApiKeyRequired: true
        AdminStats:
          Type: Api
          Properties:
            RestApiId: !Ref GroundTruthApi
            Path: /admin/stats
            Method: get
            Auth:
              ApiKeyRequired: true
        AdminBulkUpdate:
          Type: Api
          Properties:
            RestApiId: !Ref GroundTruthApi
            Path: /admin/issues/bulk
            Method: post
            Auth:
              ApiKeyRequired: true
        AdminPhotoUpload:
          Type: Api
          Properties:
            RestApiId: !Ref GroundTruthApi
            Path: /admin/issues/{id}/photo-upload
            Method: get
            Auth:
              ApiKeyRequired: true

  # ── CloudWatch Alarms ─────────────────────────────────────────────────────────

  SyncBatchErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: GroundTruth-SyncBatch-Errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref SyncBatchFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: GroundTruth-API-5xx
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Dimensions:
        - Name: ApiName
          Value: groundtruth-api
        - Name: Stage
          Value: prod
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

# ── Outputs ───────────────────────────────────────────────────────────────────

Outputs:
  ApiUrl:
    Description: >
      API Gateway base URL — set this as VITE_API_BASE_URL in Amplify
    Value: !Sub "https://${GroundTruthApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
    Export:
      Name: GroundTruthApiUrl

  IssuesTableName:
    Description: DynamoDB table name
    Value: !Ref IssuesTable
    Export:
      Name: GroundTruthIssuesTable

  PhotosBucketName:
    Description: S3 bucket for issue photos
    Value: !Ref PhotosBucket
    Export:
      Name: GroundTruthPhotosBucket

  AdminApiKeyNote:
    Description: >
      After deploy: create an API key in API Gateway console,
      associate it with the GroundTruth usage plan.
      Then set VITE_ADMIN_API_KEY in Amplify environment variables.
    Value: "See AWS Console > API Gateway > API Keys"
